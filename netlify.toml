[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions/"
  node_bundler = "nft"
  included_files = ["node_modules/@waline/vercel/src/**", "node_modules/@waline/vercel/view/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/comment/:splat"
  status = 200
  force = true
